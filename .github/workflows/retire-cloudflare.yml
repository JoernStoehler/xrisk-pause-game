name: Retire legacy Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect or retire the single legacy global-pause project
        type: choice
        required: true
        default: inspect
        options:
          - inspect
          - retire

permissions:
  contents: read

jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RETIRE_MODE: ${{ inputs.mode }}
    steps:
      - name: Inspect or retire global-pause only
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          if not account or not token:
              raise SystemExit('Cloudflare credentials are missing')
          api = 'https://api.cloudflare.com/client/v4'
          path = '/accounts/' + account + '/pages/projects/global-pause'
          class ApiError(Exception):
              def __init__(self, status, codes, method, messages):
                  self.status, self.codes = status, codes
                  super().__init__('Cloudflare ' + method + ' failed: HTTP ' + str(status) + ', codes ' + str(codes) + ', ' + str(messages))
          def call(method, suffix, body=None, allow_missing=False):
              raw = json.dumps(body).encode() if body is not None else None
              req = urllib.request.Request(api + suffix, data=raw, method=method,
                  headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as error:
                  try:
                      data = json.load(error)
                  except Exception:
                      data = {}
                  codes = [item.get('code') for item in data.get('errors', [])]
                  if allow_missing and (error.code == 404 or 8000007 in codes):
                      return None
                  messages = [str(item.get('message', ''))[:300].replace(token, '[token]').replace(account, '[account]')
                      for item in data.get('errors', [])]
                  raise ApiError(error.code, codes, method, messages)
              if not data.get('success'):
                  raise SystemExit('Cloudflare API returned an unsuccessful result')
              return data.get('result')
          project = call('GET', path, allow_missing=True)
          if project is None:
              print('global-pause project already absent')
              raise SystemExit(0)
          if project.get('name') != 'global-pause':
              raise SystemExit('Unexpected project identity')
          source = project.get('source') or {}
          print(json.dumps({
              'project': project['name'],
              'subdomain': project.get('subdomain'),
              'domains': project.get('domains', []),
              'git_source_type': source.get('type'),
              'git_source_repo': (source.get('config') or {}).get('repo_name'),
              'git_source_owner': (source.get('config') or {}).get('owner'),
              'production_auto_deploy': (source.get('config') or {}).get('production_deployments_enabled'),
              'preview_auto_deploy': (source.get('config') or {}).get('preview_deployment_setting')
          }, sort_keys=True))
          if os.environ['RETIRE_MODE'] != 'retire':
              raise SystemExit(0)
          subdomain = project.get('subdomain')
          custom = [domain for domain in project.get('domains', []) if domain != subdomain]
          if custom:
              # Do not leave custom DNS dangling or modify an unrelated zone.
              # Project deletion waits for separate verified DNS cleanup.
              if source.get('type') == 'github':
                  call('PATCH', path, {'source': {'type': 'github', 'config': {
                      'production_deployments_enabled': False,
                      'preview_deployment_setting': 'none'}}})
                  print('Automatic deployments disabled')
              raise SystemExit('Custom domains need DNS cleanup before project deletion: ' + ', '.join(custom))
          active = (project.get('canonical_deployment') or project.get('production_deployment') or {}).get('id')
          for batch in range(100):
              try:
                  call('DELETE', path)
                  break
              except ApiError as error:
                  if 8000076 not in error.codes:
                      raise
              # Cloudflare documents project deletion failing above 100
              # deployments. Prune a batch, retaining active production, then
              # retry. Use Wrangler's query-free list request and re-list after
              # deletions; this API rejects the documented pagination options.
              deployments = call('GET', path + '/deployments')
              candidates = [item for item in deployments
                  if item.get('id') != active and
                  (active or item.get('environment') != 'production')]
              if not candidates:
                  raise SystemExit('No safely removable deployments; active production identity unavailable or no candidates')
              for deployment in candidates:
                  call('DELETE', path + '/deployments/' + deployment['id'] + '?force=true')
              print('Pruned ' + str(len(candidates)) + ' old deployments; retained active production')
          else:
              raise SystemExit('Deployment cleanup reached its bounded batch limit')
          missing = call('GET', path, allow_missing=True)
          if missing is not None:
              raise SystemExit('Project still present after deletion')
          print('Deleted global-pause project and verified it is absent')
          PY

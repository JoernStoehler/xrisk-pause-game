      - safe_transformative_deployment
      - unsafe_superintelligence_extinction

action_pipeline:
  stages:
    - proposal
    - DG_choice
    - authority_and_required_approvals
    - implementation_attempt
    - immediate_costs_and_signals
    - actor_adaptation
    - delayed_technical_and_political_effects
  invariant: An accepted proposal can fail, be delayed, be narrowed, or backfire.

policy_actions:
  - id: A_THRESHOLD
    family: prohibit_training_or_workloads_above_resource_threshold
    parameters:
      - covered_resource_vector_including_compute_memory_network_and_power
      - accounting_rule_over_resources_workload_and_time
      - threshold_or_prohibited_region
      - workload_definition
      - jurisdictions
      - exceptions
    principal_effects:
      - reduces_authorized_frontier_training
      - creates_classification_and_substitution_pressure

  - id: A_MONITOR
    family: place_monitor_with_stop_authority
    parameters: [sites, evidence_access, interruption_latency, independence]
    principal_effects:
      - shortens_response_at_obvious_sites
      - produces_evidence
      - creates_monitor_capture_and_evasion_surface

  - id: A_CONTROL
    family: change_physical_or_factual_control
    variants:
      - voluntary_stop_with_or_without_evidence
      - legal_ban_with_external_enforcement
      - credentials_or_power_cutoff
      - factual_custody_transfer
      - physical_relocation_and_consolidation
      - component_removal
      - destruction
    principal_effects:
      - changes_who_can_act_and_how_fast
      - imposes_economic_legitimacy_and_reconstruction_costs

  - id: A_INFERENCE
    family: set_existing_frontier_inference_policy
    variants:
      - cold_storage
      - restricted_hosted_inference
      - broad_hosted_inference
    parameters:
      - named_users_and_tasks
      - rate_price_tool_and_memory_limits
      - logging
      - weight_access
      - successor_training_use
    principal_effects:
      - changes_economic_benefit_and_constituencies
      - changes_research_experiment_throughput
      - changes_cyber_leakage_cover_and_evasion_capacity
    status: [included, unresolved]

  - id: A_TREATY
    family: negotiate_or_change_treaty_commitments_and_support
    parameters:
      - accession_or_participation
      - reciprocal_assurance_and_data_access
      - dispute_resolution_and_contingent_response
      - implementation_assistance_and_supply_chain_cooperation
      - compensation_due_process_and_reversibility
      - side_payments_issue_linkage_and_security_assurances
    principal_effects:
      - changes_formal_commitments_authority_and_reciprocal_evidence
      - changes_implementation_capacity_and_domestic_coalitions
      - may_stabilize_cooperation_or_create_bargaining_and_linkage_failure_surfaces

  - id: A_INSPECT
    family: change_verification_and_cross_monitoring
    parameters:
      - domestic_or_cross_national
      - site_and_supply_chain_scope
      - raw_data_access
      - challenge_inspection
      - chain_of_custody
    principal_effects:
      - changes_detection_and_false_positive_processes
      - changes_sovereignty_cost_and_reciprocal_confidence

  - id: A_ENFORCE
    family: escalate_against_suspected_violation
    variants:
      - request_and_clarify
      - investigate
      - suspend_access_or_trade
      - seize_or_disable
      - cyber_sabotage
      - kinetic_action
    principal_effects:
      - may_stop_or_delay_project
      - may reveal_or_destroy_evidence
      - may deter_or_displace_activity
      - may damage_legitimacy_cooperation_or_crisis_stability

  - id: A_RESEARCH
    family: restrict_or_fund_research
    parameters:
      - field_or_method
      - safety_or_capability_classification
      - publication_and_information_controls
      - approved_compute_and_model_access
    principal_effects:
      - changes_safety_and_capability_progress
      - creates_dual_use_classification_and_leakage_risk

  - id: A_INSTITUTION
    family: change_ISIA_capacity_and_governance
    parameters:
      - hiring_and_selection
      - delegation
      - independent_review
      - dissent_protection
      - selection_for_calibrated_pessimism_and_error_detection
      - continuity_measures
      - anti_capture_rules
      - transparency_and_public_justification
    principal_effects:
      - changes_task_specific_competence_and_error_correlation
      - changes_implementation_and_evidence_quality
      - changes_legitimacy_and_capture_surface

  - id: A_SAFETY_EXIT
    family: evaluate_authorize_or_reject_transformative_build
    parameters:
      - candidate
      - proposed_threat_model
      - required_claims
      - evaluator_selection
      - evidence_threshold
      - staged_build_controls
      - foundational_result_secrecy_and_controlled_circulation
    principal_effects:
      - may_continue_pause
      - may authorize_objectively_safe_build
      - may authorize_persuasive_but_unsafe_build

transition_modules:
  - id: T_ECONOMY
    reads:
      - H_POL
      - technology
      - compute_assets
      - model_assets
      - control_regime
      - A_CONTROL
      - A_INFERENCE
      - A_RESEARCH
    writes:
      - economy_and_distribution
      - public_economic_signals
      - constituency_formation_opportunities
    semantics: >-
      Actual services, costs, distributional effects, substitution, and adaptation
      evolve before they are selectively observed and politically interpreted.
      The module is sectoral and coarse, not a general-equilibrium forecast.

  - id: T_TECH
    reads: [H_CAP, technology, compute_assets, model_assets, A_INFERENCE, A_RESEARCH]
    writes: [capability_profiles, efficiency_frontier, project_opportunities]
    semantics: >-
      Resource- and task-graph-mediated research changes persistent technical
      state. It can make bounded improvements, hit bottlenecks, or open a new
      paradigm. Benchmark observations are noisy projections of this state.

  - id: T_REINVEST
    reads: [H_REINVEST, technical_projects, capability_profiles, access_and_control]
    writes: [artifacts, carrier_transitions, successor_projects, response_races]
    semantics: >-
      Candidate improvements move fallibly between context-local, communicated,
      scaffold-persistent, and inherited carriers. Evaluation, implementation,
      resource access, and response each take time. Improvement can fizzle.

  - id: T_CONTROL
    reads: [H_CONTROL, control_regime, compute_assets, model_assets, actor_conduct]
    writes: [actual_workloads_and_model_uses, evidence_objects, access_graphs, enforcement_cases]
    semantics: >-
      Rules and monitors alter opportunity but do not directly set compliance.
      Actors act through resources they factually control; evasion and sensor
      error can yield violations without alerts or alerts without violations.

  - id: T_POLITICS
    reads: [H_POL, actors, information_objects, economy_and_distribution, public_view, action_costs, external_events_and_crises]
    writes: [beliefs, coalitions, authority, implementation, exemptions, continuity]
    semantics: >-
      Recipient-specific information and interests affect actor decisions.
      Interventions pass through veto points and implementers. War, bargaining
      linkage, agenda displacement, and physical access failure are distinct
      pathways even when they co-occur.

  - id: T_SAFETY_REVIEW
    reads: [H_SAFE, safety_candidates, information_objects, institutions]
    writes: [dossiers, recommendations, institutional_approval]
    semantics: >-
      Evaluators see evidence, not ground truth. Selection, school-specific blind
      spots, correlated errors, filtered dissent, and manipulation can generate
      correct rejection, justified approval, or a false pass.

  - id: T_BUILD
    reads:
      - safety_candidates.ground_truth_by_claim
      - safety_candidates.institutional_approval
      - safety_candidates.legal_authorization
      - safety_candidates.actual_implementation
      - technical_projects
      - active_improvement_loops
      - compute_assets
      - model_assets
      - access_and_control
    writes: [terminal_or_continuing_state]
    semantics: >-
      Approval and authorization are neither descriptions of objective safety
      nor sufficient causes of deployment. A decisive process may be authorized,
      covert, ambiguously authorized, or arise inside a permitted inference or
      improvement episode. Starting a dangerous run is nonterminal: interruption
      latency races hidden within-run improvement and takeover latency. Only a
      completed decisive process that defeats remaining concrete control paths
      resolves to terminal loss.

  - id: T_CRISIS
    reads: [external_events_and_crises, actor_graph, continuity, compute_assets, model_assets, treaty_commitments]
    writes: [access, evidence_channels, emergency_authority, subordinate_opportunities]
    semantics: >-
      A crisis can unravel operational restraint while top leaders retain the
      catastrophe belief. This does not require either leader to order an AI race.

observation_model:
  views:
    omniscient_debug:
      audience: developers_only
      sees: latent_world_and_all_transitions
    DG_play_view:
      audience: player
      sees:
        - advisor_cards
        - dossiers_and_reports_received
        - public_events
        - declared_policy_and_known_implementation
        - deliberately_coarse_state_indicators
      does_not_see:
        - latent_hypothesis_sample
        - true_compliance
        - true_safety_adequacy
        - exact_ASI_or_RSI_threshold
        - exact_survival_probability
    actor_local_view:
      audience: simulated_actor
      sees: information_reachable_through_actor_specific_edges
    retrospective_run_explanation:
      audience: player_after_run
      sees: selected_hidden_causes_and_counterfactual_explanations
      constraint: reveal_enough_to_teach_without_claiming_unique_historical_truth

event_order:
  - mature_scheduled_projects_and_external_events
  - sample_conditional_actor_conduct
  - execute_technical_and_control_processes
  - generate_sensor_reports_and_public_signals
  - route_information_to_recipients
  - update_actor_interpretations_and_proposals
  - request_player_decision_where_due
  - resolve_authority_and_implementation
  - apply_costs_adaptation_and_delayed_effects
  - check_terminal_processes
  - append_trace_records
  - advance_to_next_decision_relevant_time

terminal_invariants:
  - capability_leakage_is_nonterminal_and_updates_future_efficiency_or_route_feasibility
  - dangerous_run_initiation_is_nonterminal_until_improvement_takeover_or_interruption_resolves
  - signatory_withdrawal_is_nonterminal_and_may_be_followed_by_reentry_and_control_restoration
  - successful_interruption_need_not_reveal_the_counterfactual_distance_to_loss

terminal_processes:
  - id: WIN_SAFE
    preconditions:
      - decisive_candidate_covers_the_hidden_world_relevant_threats_not_merely_its_proposed_threat_model
      - deployment_and_successor_process_preserve_adequacy
      - candidate_is_actually_implemented
    outcome: safe_transformative_intelligence_and_humanity_survives
    note: recognition_and_authorization_affect_reachability_but_not_ground_truth

  - id: LOSS_UNSAFE
    preconditions:
      - RSI_capable_or_otherwise_decisive_unsafe_system_is_actually_created_or_released
      - system_obtains_the_route_specific_capability_and_access_needed_for_takeover
      - no_remaining_concrete_control_or_interruption_path_prevents_takeover
    process:
      - model_capability_and_access_acquisition
      - defeat_or_bypass_human_countermeasures
      - strategic_takeover
      - novel_technology_enabled_extinction
    outcome: humanity_extinct
    note: do_not_limit_failure_to_present_day_weapon_technologies

  - id: CONTINUE_PAUSE
    classification: nonterminal
    condition: no_decisive_safe_or_unsafe_system_has_resolved_the_run

required_trace_fields:
  - event_id_and_time
  - module_and_transition_id
  - latent_cause_references
  - actor_and_action_references
  - information_available_to_each_decider
  - authority_and_implementation_result
  - stochastic_draw_name_and_conditioning_parent_ids
  - state_delta
  - immediate_and_scheduled_consequences
  - player_visible_explanation

forbidden_shortcuts:
  - treaty_health_scalar_directly_causes_compliance
  - safety_progress_scalar_directly_causes_safe_build
  - capability_multiplier_directly_causes_RSI_without_route_or_resources
  - advisor_receives_noisy_direct_ground_truth
  - legal_ban_directly_sets_actual_workload_to_zero
  - false_sensor_alert_implies_actual_violation
  - accepted_policy_is_instantly_and_perfectly_implemented
  - treaty_breakdown_immediately_sets_game_over
  - independent_redraw_of_fundamental_world_difficulty_each_turn

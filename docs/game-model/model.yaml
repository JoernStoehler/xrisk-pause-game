    - elapsed_time
    - pending_deadlines
    - queued_events
  technology:
    - deployed_model_capability_profiles
    - algorithmic_efficiency_profiles_and_method_portfolio
    - research_technology_portfolios
    - active_improvement_loops
    - known_and_hidden_artifacts
  control_regime:
    - legal_thresholds
    - covered_resources_including_memory
    - site_registry
    - custody_and_access_graph
    - model_and_weight_access_graph
    - workload_permissions
    - inspection_and_stop_authority
    - implementation_latency_by_action_stage_actor_and_site
    - enforcement_escalation_state_by_case_and_target
  institutions:
    - actor_and_authority_graph
    - domestic_implementation_gates_by_action_and_jurisdiction
    - legal_basis_appropriation_sunset_and_court_state_by_action

meta:
  id: isia_game_symbolic_model_v0
  maturity: reconstructed_unverified
  status: [uncalibrated]
  purpose: >-
    Human-readable specification of the simplified playable engine. This is a
    review and conformance artifact, not executable code and not the expert model.
  time_resolution:
    representation: event_driven_with_calendar_time
    opening_window: days_to_months
    later_window: months_to_decades
    note: A turn need not consume a fixed duration.

world_sample:
  timing: once_at_run_start
  conditioning: sampled_after_fixed_scenario_premises_are_selected
  persistence: persistent_within_run
  correlation: conditional_dependencies_and_shared_latents
  prohibition: do_not_redraw_fundamental_difficulty_after_each_decision
  families:
    - id: H_CAP
      name: capability production
      status: [included, uncalibrated]
      contains:
        - within_paradigm_effective_compute_to_general_capability_shape
        - ragged_domain_profiles_and_phase_changes
        - algorithmic_efficiency_process
        - research_labor_and_AI_assistance_productivity
        - paradigm_shift_opportunities
      constraints:
        - benchmark_regressions_are_mostly_measurement_or_distribution_effects
        - latent_learning_progress_is_persistent_not_independently_redrawn
        - qualitative_prerequisites_can_remain_at_high_effective_compute

    - id: H_REINVEST
      name: cognitive reinvestment and RSI
      status: [included, uncalibrated, unresolved]
      contains:
        - prerequisite_task_graphs
        - candidate_improvement_portfolios
        - serial_depth_and_parallelism
        - evaluation_error_and_false_leads
        - improvement_carrier_transitions
        - fizzle_bottlenecks
        - access_acquisition_and_response_races
      route_families:
        - internal_cognitive_procedure
        - explicit_machine_learning_theory_or_code
        - trained_successor
        - human_AI_research_lab
        - hardware_or_systems_improvement
        - economic_or_distributed_reinvestment
      carrier_scopes:
        - context_local
        - communicated
        - scaffold_persistent
        - successor_inherited
      prohibition: no_single_universal_RSI_threshold_or_geometric_multiplier

    - id: H_CONTROL
      name: compute control and evasion
      status: [included, uncalibrated]
      contains:
        - site_discoverability
        - monitor_and_sensor_reliability
        - compute_memory_network_and_power_substitution
        - distributed_training_feasibility
        - component_diversion_and_reconstruction
        - enforcement_response_latency
        - insider_and_state_actor_concealment_skill

    - id: H_POL
      name: political and institutional dynamics
      status: [included, uncalibrated]
      contains:
        - actor_specific_beliefs_preferences_skills_and_authority
        - public_and_elite_opinion_responsiveness
        - coalition_and_constituency_formation
        - capture_and_policy_feedback
        - bureaucratic_reliability_and_normal_accidents
        - crisis_continuity_and_issue_linkage
        - bargaining_misperception_and_higher_order_beliefs
        - enforcement_legitimacy_and_backlash
      prohibition: no_single_treaty_health_meter_as_complete_causal_state

    - id: H_SAFE
      name: safety tractability and recognition
      status: [included, uncalibrated, unresolved]
      contains:
        - candidate_specific_objective_adequacy
        - threat_model_coverage
        - evidence_relevance_and_manipulability
        - evaluator_school_competence_and_correlation
        - human_recognizability_of_objective_adequacy
        - institution_building_beyond_historical_precedent
        - calibrated_pessimism_and_wishful_error_rejection
        - foundational_research_secrecy_labor_and_political_legibility
        - designed_cognition_route
        - control_assisted_learned_system_route
        - enhanced_human_route
      current_route_weighting: >-
        No presently brainstormed route is judged adequate. Enhanced or uploaded
        humans are Jörn's leading speculative route; other routes remain live
        ontology branches rather than equally weighted candidates.
      prohibition: no_generic_labor_prestige_or_route_label_to_alignment_adequacy_meter

scenario_initialization:
  mainline_pause_founded:
    status: [included, uncalibrated]
    fixed_premises:
      - United_States_and_China_are_founding_signatories
      - ISIA_exists_and_the_player_is_its_Director_General
      - both_top_leaderships_initially_accept_the_need_for_a_frontier_training_pause
      - known_frontier_sites_can_be_approached_immediately
    unresolved_opening_choices:
      - domestic_implementation_and_reciprocal_inspection
      - inference_policy
      - custody_consolidation_and_resource_coverage
      - military_and_intelligence_scope
      - global_accession_and_third_country_enforcement
    requirement: >-
      A dated starting-state card must supply actual sites, assets, legal powers,
      deployed models, and outstanding projects; rumors and verified facts must
      be distinct. This scenario conditions the game and is not a forecast that
      the treaty will form.

